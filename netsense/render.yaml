services:
  - type: web
    name: netsense-campus
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn netsense.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DJANGO_DEBUG
        value: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,netsense.sreeraj.me

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://netsense.sreeraj.me

      - key: DATABASE_URL
        fromDatabase:
          name: netsense-db
          property: connectionString

databases:
  - name: netsense-db
    databaseName: netsense_db
    user: netsense_user