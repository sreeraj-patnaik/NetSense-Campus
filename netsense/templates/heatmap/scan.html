{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="panel">
    <h2>Admin Signal Sampling</h2>
    <p>Select a location on the floor map, then enter signal strength and save.</p>

    <form id="scanForm" method="post" class="scan-form">
        {% csrf_token %}
        <label>
            Block
            <select name="block" id="scanBlock">
                {% for block in blocks %}
                    <option value="{{ block }}">{{ block }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Floor
            <select name="floor" id="scanFloor">
                {% for floor in floors %}
                    <option value="{{ floor }}">{{ floor }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Mode
            <select name="mode" id="scanMode">
                {% for value, label in modes %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Network Name
            <input name="network_name" type="text" placeholder="Campus WiFi / Carrier">
        </label>
        <label>
            Signal (dBm)
            <input name="signal_strength" type="number" required placeholder="-72">
        </label>
        <div class="cell-readout">
            Selected Cell: <strong id="selectedCellText">None</strong>
        </div>
        <input type="hidden" name="cell_x" id="cellXInput" required>
        <input type="hidden" name="cell_y" id="cellYInput" required>
        <button type="submit">Save Scan</button>
    </form>
</section>

<section
    class="map-wrap scan-map"
    id="scanMapWrap"
    data-rows="{{ grid_rows }}"
    data-cols="{{ grid_cols }}"
>
    <img
        id="scanFloorMap"
        src="{% static 'heatmap/images/floor-placeholder.svg' %}"
        alt="Floor map for scanning"
    >
    <div id="scanGridLayer" class="grid-layer"></div>
    <div id="scanMarkerLayer" class="heatmap-layer"></div>
</section>

<script>
    window.NETSENSE_SCAN_CONFIG = {
        rows: {{ grid_rows }},
        cols: {{ grid_cols }},
        floorImageTemplate: "{% static 'heatmap/images/floor-placeholder.svg' %}"
    };
</script>
<script src="{% static 'heatmap/js/scan.js' %}"></script>
{% endblock %}
