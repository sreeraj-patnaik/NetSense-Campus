{% extends "base.html" %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="auth-card reveal">
            <span class="pill">Administrator access</span>
            <h2>Admin Login</h2>
            <p>Secure access to scan capture and system configuration.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn primary" type="submit">Login</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
